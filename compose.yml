name: spoolprint

services:
  spoolprint:
    image: ghcr.io/sidtheturtle/spoolprint:latest
    container_name: spoolprint
    environment:
      - TZ=Europe/London
    ports:
      - "6464:6464"
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
    name: spoolprint_data
